name: cd

on:
  push:
    tags:
      - 'v*'
      - 'runtime/v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    # The generator's stream only. `runtime/v*` publishes the runtime tree and
    # nothing else — no CUE module, no release assets.
    if: ${{ !startsWith(github.ref, 'refs/tags/runtime/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CUE publish runs before tarball staging: `cue mod publish`
      # with `source: kind: "git"` rejects an unclean working tree,
      # and the staging step creates untracked dist/ + bayt-stage/.
      - name: Set up CUE
        if: startsWith(github.ref, 'refs/tags/')
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: 'latest'

      # OIDC login to registry.cue.works. Requires a one-time trust
      # entry configured on cue.dev binding this workflow to publish
      # under github.com/bonisoft3/bayt.
      - name: Authenticate to CUE Central Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: cue-labs/registry-login-action@v1

      - name: Publish CUE module
        if: startsWith(github.ref, 'refs/tags/')
        run: cue mod publish "${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # mirror.gcr.io: dodge Docker Hub's anonymous pull cap on buildkit pulls.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: bonitao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (bayt)
        id: meta-bayt
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/bonisoft3/bayt
            bonitao/bayt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push bayt
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta-bayt.outputs.tags }}
          labels: ${{ steps.meta-bayt.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stage release content
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          # bayt is pure source (cue + nu) — no compile step. Stage the
          # tree minus repo-only files into a release directory.
          mkdir bayt-stage
          tar cf - --exclude=.git --exclude=.github --exclude=tests --exclude=dist --exclude=bayt-stage . | tar xf - -C bayt-stage
          # Ship per-platform-named tarballs (same content). Mise's
          # `github:` backend matches the consumer runner's platform
          # against the asset name; for a source-only tool we publish
          # one universal payload under every platform name.
          for triple in linux-x64 linux-arm64 linux-armv7 macos-x64 macos-arm64 windows-x64 windows-arm64; do
            tar czf "dist/bayt-${triple}.tar.gz" -C bayt-stage .
          done

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  runtime:
    # The runtime tree alone, on its own version stream — see Dockerfile.runtime.
    if: ${{ startsWith(github.ref, 'refs/tags/runtime/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The default `docker` driver takes neither a two-platform build nor a
      # registry exporter carrying rewrite-timestamp.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bonitao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (bayt-runtime)
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/bonisoft3/bayt-runtime
            bonitao/bayt-runtime
          tags: |
            type=match,pattern=runtime/v(.*),group=1

      # Reproducible by construction: the Dockerfile is FROM scratch + COPY, so
      # there is no computation to vary. The three settings below cover
      # everything that remains — the frontend is pinned in the Dockerfile,
      # SOURCE_DATE_EPOCH and rewrite-timestamp clamp mtimes, and attestations
      # carry build metadata that would otherwise move the index digest.
      # Two --no-cache builds of one tree then produce one digest.
      - name: Build and push bayt-runtime
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          outputs: type=registry,rewrite-timestamp=true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          # No labels. They live in the image config, so they change the
          # digest, and metadata-action stamps a wall-clock
          # org.opencontainers.image.created — which would give every run a
          # different digest and repoint a tag away from the pinned manifest.
